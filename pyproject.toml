[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
per-file-ignores = { "analysis/*" = ["E402"], "experiments/*" = ["E402"], "tests/*" = ["E402"] }

